name: Build Geode Mod

on:
  workflow_dispatch:
  push:
    branches: ["**"]

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        config:
        - name: Android64
          os: ubuntu-24.04
          target: Android64
        - name: Android32
          os: ubuntu-24.04
          target: Android32
    name: ${{ matrix.config.name }}
    runs-on: ${{ matrix.config.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Build the mod
        uses: geode-sdk/build-geode-mod@main
        with:
          bindings: geode-sdk/bindings
          bindings-ref: 1605f500d053f8de122bf5c7dc6d17c24866e02e
          combine: true
          target: ${{ matrix.config.target }}

      - name: Report errors
        if: failure()
        shell: bash
        run: |
          echo "::error::GEODE_SDK=$GEODE_SDK bindings=$GEODE_BINDINGS_REPO_PATH"
          NDK=/usr/local/lib/android/sdk/ndk/29.0.14206865
          ABI=arm64-v8a; [ "${{ matrix.config.target }}" = "Android32" ] && ABI=armeabi-v7a
          rm -rf dbg
          cmake -B dbg -DCMAKE_BUILD_TYPE=RelWithDebInfo -DCMAKE_C_COMPILER=clang -DCMAKE_CXX_COMPILER=clang++ -G Ninja -DCMAKE_TOOLCHAIN_FILE=$NDK/build/cmake/android.toolchain.cmake -DANDROID_STL=c++_shared -DANDROID_ABI=$ABI -DANDROID_PLATFORM=android-23 -DGEODE_DONT_INSTALL_MODS=ON -DGEODE_TARGET_PLATFORM=${{ matrix.config.target }} > log.txt 2>&1 && cmake --build dbg >> log.txt 2>&1
          grep -inE "error|fatal|undefined|failed|not found" log.txt | head -8 | while IFS= read -r l; do echo "::error::${l:0:900}"; done
          tail -n 3 log.txt | while IFS= read -r l; do echo "::warning::${l:0:900}"; done

  package:
    name: Package builds
    runs-on: ubuntu-24.04
    needs: ['build']
    steps:
      - uses: geode-sdk/build-geode-mod/combine@main
        id: build
      - uses: actions/upload-artifact@v4
        with:
          name: Build Output
          path: ${{ steps.build.outputs.build-output }}
