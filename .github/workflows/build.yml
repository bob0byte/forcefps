name: Build Geode Mod

on:
  workflow_dispatch:
  push:
    branches: ["**"]

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        config:
        - name: Android64
          os: ubuntu-24.04
          target: Android64
        - name: Android32
          os: ubuntu-24.04
          target: Android32
    name: ${{ matrix.config.name }}
    runs-on: ${{ matrix.config.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Build the mod
        uses: geode-sdk/build-geode-mod@main
        with:
          bindings: geode-sdk/bindings
          bindings-ref: 1605f500d053f8de122bf5c7dc6d17c24866e02e
          combine: true
          target: ${{ matrix.config.target }}

      - name: Report errors
        if: failure()
        shell: bash
        run: |
          for c in $(find "$GITHUB_WORKSPACE" .. -maxdepth 4 -name CMakeCache.txt 2>/dev/null); do
            d=$(dirname "$c"); echo "::error::build dir $d"
            cmake --build "$d" 2>&1 | grep -iE "error|fatal|undefined|failed" | head -9 | while IFS= read -r l; do echo "::error::${l:0:900}"; done
          done
          ls -la "$GITHUB_WORKSPACE" | sed 's/^/::warning::/' | head -20

  package:
    name: Package builds
    runs-on: ubuntu-24.04
    needs: ['build']
    steps:
      - uses: geode-sdk/build-geode-mod/combine@main
        id: build
      - uses: actions/upload-artifact@v4
        with:
          name: Build Output
          path: ${{ steps.build.outputs.build-output }}
